<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News App</title>

  <!-- Inline CSS -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Roboto:wght@500&display=swap");

    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    :root {
        --primary-text-color: #183b56;
        --secondary-text-color: #577592;
        --accent-color: #2294ed;
        --accent-color-dark: #1d69a3;
    }

    body {
        font-family: "Poppins", sans-serif;
        color: var(--primary-text-color);
    }

    p {
        font-family: "Roboto", sans-serif;
        color: var(--secondary-text-color);
        line-height: 1.4rem;
    }

    a {
        text-decoration: none;
    }

    ul {
        list-style: none;
    }

    .flex {
        display: flex;
        align-items: center;
    }

    .container {
        max-width: 1180px;
        margin-inline: auto;
        overflow: hidden;
    }

    nav {
        background-color: #f3faff;
        box-shadow: 0 0 4px #bbd0e2;
        position: fixed;
        top: 0;
        z-index: 99;
        left: 0;
        right: 0;
    }

    .main-nav {
        justify-content: space-between;
        padding-block: 8px;
    }

    .company-logo img {
        width: 120px;
    }

    .nav-links ul {
        gap: 16px;
    }

    .hover-link {
        cursor: pointer;
    }

    .hover-link:hover {
        color: var(--secondary-text-color);
    }

    .hover-link:active {
        color: red;
    }

    .nav-item.active {
        color: var(--accent-color);
    }

    .search-bar {
        height: 32px;
        gap: 8px;
    }

    .news-input {
        width: 200px;
        height: 100%;
        padding-inline: 12px;
        border-radius: 4px;
        border: 2px solid #bbd0e2;
        font-family: "Roboto", sans-serif;
    }

    .search-button {
        background-color: var(--accent-color);
        color: white;
        padding: 8px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-family: "Roboto", sans-serif;
    }

    .search-button:hover {
        background-color: var(--accent-color-dark);
    }

    main {
        padding-block: 20px;
        margin-top: 80px;
    }

    .cards-container {
        justify-content: space-between;
        flex-wrap: wrap;
        row-gap: 20px;
        align-items: start;
    }

    .card {
        width: 360px;
        min-height: 400px;
        box-shadow: 0 0 4px #d4ecff;
        border-radius: 4px;
        cursor: pointer;
        background-color: #fff;
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .card:hover {
        box-shadow: 1px 1px 8px #d4ecff;
        background-color: #f9fdff;
        transform: translateY(-2px);
    }

    .card-header img {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }

    .card-content {
        padding: 12px;
    }

    .news-source {
        margin-block: 12px;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="container main-nav flex">
      <a href="#" class="company-logo" onclick="reload()">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="logo">
      </a>
      <div class="nav-links">
        <ul class="flex">
          <li class="hover-link nav-item" id="India" onclick="onNavItemClick('India')">India</li>
          <li class="hover-link nav-item" id="Technology" onclick="onNavItemClick('Technology')">Technology</li>
          <li class="hover-link nav-item" id="Sports" onclick="onNavItemClick('Sports')">Sports</li>
          <li class="hover-link nav-item" id="Finance" onclick="onNavItemClick('Finance')">Finance</li>
          <li class="hover-link nav-item" id="Politics" onclick="onNavItemClick('Politics')">Politics</li>
        </ul>
      </div>
      <div class="search-bar flex">
        <input id="search-text" type="text" class="news-input" placeholder="Search News">
        <button id="search-button" class="search-button">Search</button>
      </div>
    </div>
  </nav>

  <!-- Main Section -->
  <main>
    <div class="cards-container container flex" id="cards-container"></div>
  </main>

  <!-- Template -->
  <template id="template-news-card">
    <div class="card">
      <div class="card-header">
        <img id="news-img" src="" alt="news-image">
      </div>
      <div class="card-content">
        <h3 id="news-title">Title</h3>
        <h6 class="news-source" id="news-source">Source</h6>
        <p class="news-desc" id="news-desc">Description</p>
      </div>
    </div>
  </template>

  <!-- Inline JavaScript -->
  <script>
    const API_KEY = "abdac1f6728c4cf0939a0b92e1568883";
    const url = "https://newsapi.org/v2/everything?q=";

    window.addEventListener("load", () => fetchNews("India"));

    function reload() {
      window.location.reload();
    }

    async function fetchNews(query) {
      const res = await fetch(`${url}${query}&apiKey=${API_KEY}`);
      const data = await res.json();
      bindData(data.articles);
    }

    function bindData(articles) {
      const cardsContainer = document.getElementById("cards-container");
      const newsCardTemplate = document.getElementById("template-news-card");

      cardsContainer.innerHTML = "";

      articles.forEach((article) => {
        if (!article.urlToImage) return;
        const cardClone = newsCardTemplate.content.cloneNode(true);
        fillDataInCard(cardClone, article);
        cardsContainer.appendChild(cardClone);
      });
    }

    function fillDataInCard(cardClone, article) {
      const newsImg = cardClone.querySelector("#news-img");
      const newsTitle = cardClone.querySelector("#news-title");
      const newsSource = cardClone.querySelector("#news-source");
      const newsDesc = cardClone.querySelector("#news-desc");

      newsImg.src = article.urlToImage;
      newsTitle.innerHTML = article.title;
      newsDesc.innerHTML = article.description;

      const date = new Date(article.publishedAt).toLocaleString("en-US", {
        timeZone: "Asia/Jakarta",
      });

      newsSource.innerHTML = `${article.source.name} · ${date}`;

      cardClone.firstElementChild.addEventListener("click", () => {
        window.open(article.url, "_blank");
      });
    }

    let curSelectedNav = null;
    function onNavItemClick(id) {
      fetchNews(id);
      const navItem = document.getElementById(id);
      curSelectedNav?.classList.remove("active");
      curSelectedNav = navItem;
      curSelectedNav.classList.add("active");
    }

    const searchButton = document.getElementById("search-button");
    const searchText = document.getElementById("search-text");

    searchButton.addEventListener("click", () => {
      const query = searchText.value;
      if (!query) return;
      fetchNews(query);
      curSelectedNav?.classList.remove("active");
      curSelectedNav = null;
    });
  </script>
</body>
</html>
